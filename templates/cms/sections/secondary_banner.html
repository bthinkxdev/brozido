{% load i18n %}
{% if section_context.slides %}
<section class="jm-secbanner" aria-label="{% trans 'Promotions' %}">
  <div class="container">
    <div class="jm-secbanner__grid">
      {% for slide in section_context.slides %}
      <a href="{% url 'catalog:plp' %}" class="jm-secbanner__card">
        {% if slide.type == 'video' %}
        <video class="jm-secbanner__img" autoplay muted loop playsinline disablepictureinpicture disableremoteplayback preload="metadata"
               {% if slide.poster %}poster="{{ slide.poster }}"{% endif %}>
          <source src="{{ slide.src }}">
        </video>
        {% else %}
        <img src="{{ slide.src }}" class="jm-secbanner__img" alt="{{ slide.title|default:brand.name }}" width="700" height="300" loading="lazy">
        {% endif %}
        {% if slide.title %}
        <span class="jm-secbanner__caption">
          <span class="jm-secbanner__title">{{ slide.title }}</span>
          <span class="jm-secbanner__cta">{% trans "Shop Now" %} <span aria-hidden="true">→</span></span>
        </span>
        {% endif %}
      </a>
      {% endfor %}
    </div>
  </div>
</section>
{% endif %}
